version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: warehouseiq_backend
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: warehouseiq_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
